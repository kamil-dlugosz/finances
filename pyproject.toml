[tool.poetry]
name = "finances"
version = "0.1.0"
description = "Personal finances dashboard — interactive HTML with sunburst, bar plots, waterfall, and SQL-driven charts."
authors = ["Kamil Dlugosz"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
pandas = ">=2.2,<3"
plotly = ">=6.0,<7"
pydantic = ">=2.10,<3"
pyyaml = ">=6.0,<7"
pyarrow = ">=14.0"
duckdb = ">=1.2,<2"
scikit-learn = ">=1.6,<2"
sqlparse = ">=0.5,<1"
rich = ">=13.9,<14"
numpy = ">=2.2,<3"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3,<10"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
