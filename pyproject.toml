[tool.poetry]
name = "finances"
version = "0.1.0"
description = "Personal finances dashboard — interactive HTML with sunburst, bar plots, waterfall, and SQL-driven charts."
authors = ["Kamil Dlugosz"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
pandas = "^2.2"
plotly = "^6.0"
pydantic = "^2.10"
pyyaml = "^6.0"
pyarrow = "^19.0"
duckdb = "^1.2"
scikit-learn = "^1.6"
sqlparse = "^0.5"
rich = "^13.9"
numpy = "^2.2"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
